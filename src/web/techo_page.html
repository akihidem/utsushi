<title>工作の手帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* 机に置いた iPhone の帖面。両手は工作で塞がり、声で使う（本人の指定、11-04）。本人の指摘「文字情報が多い」を受け、
   読む文はほぼ置かず、絵と大きな印で選ぶ。字は答えと短い札だけ。押す所は大きく、少なく。 */
:root{
  --wall:#f5f2ec; --paper:#fbfaf6; --ink:#27231e; --sub:#7a7062; --rule:#ddd3c0; --accent:#7a5a2e; --accent-ink:#fbfaf6;
  --ok:#3f6b4a; --warn:#8a5a1f;
  --display:"Shippori Mincho B1","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#16130f; --paper:#1e1a15; --ink:#ece4d4; --sub:#a99f8e; --rule:#3a3227; --accent:#d1ae72; --accent-ink:#1e1a15; --ok:#8fbf9a; --warn:#e0b070; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#16130f; --paper:#1e1a15; --ink:#ece4d4; --sub:#a99f8e; --rule:#3a3227; --accent:#d1ae72; --accent-ink:#1e1a15; --ok:#8fbf9a; --warn:#e0b070; color-scheme:dark}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;padding-block:24px 64px;display:grid;gap:22px}
h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.3em;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.tile{display:grid;justify-items:center;gap:6px;border:2px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;
  padding:10px;border-radius:14px;cursor:pointer;min-width:84px}
.tile[aria-pressed="true"],.tile:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile img{width:64px;height:96px;object-fit:cover;border-radius:6px;display:block}
.tile .big{font-family:var(--display);font-size:34px;line-height:1}
.tile svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile input{position:absolute;opacity:0;pointer-events:none}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.set{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:18px;display:grid;gap:14px}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:22px;letter-spacing:.15em;margin:0}
.mark svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],textarea{font:inherit;font-size:22px;color:var(--ink);background:var(--wall);border:2px solid var(--rule);padding:14px 16px;border-radius:12px;width:100%;box-sizing:border-box}
textarea{min-height:64px;font-size:18px}
button.go{font:inherit;font-weight:500;font-size:20px;background:var(--accent);color:var(--accent-ink);border:0;padding:16px 28px;border-radius:12px;cursor:pointer}
button.go[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.answer{font-size:26px;line-height:1.6;white-space:pre-wrap;padding:6px 2px}
.answer .from{display:block;font-size:12px;letter-spacing:.2em;color:var(--sub)}
.toggles{display:flex;gap:10px}
.toggle{display:grid;place-items:center;width:52px;height:52px;border:2px solid var(--rule);border-radius:50%;cursor:pointer;position:relative}
.toggle svg{width:26px;height:26px;stroke:var(--sub);fill:none;stroke-width:2.5;stroke-linecap:round}
.toggle:has(input:checked){border-color:var(--accent)}.toggle:has(input:checked) svg{stroke:var(--accent)}
.toggle input{position:absolute;opacity:0}
.shot{display:grid;place-items:center;gap:6px;border:2px dashed var(--accent);border-radius:16px;padding:22px;cursor:pointer;color:var(--accent);font-size:16px}
.shot svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.shot input{position:absolute;opacity:0;width:1px;height:1px}
.picked{font-size:14px;color:var(--sub)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:26px;height:26px}
details summary{cursor:pointer;font-size:15px;color:var(--accent)}
ol.steps{margin:8px 0 0;padding-left:1.6em;display:grid;gap:4px;font-size:16px}
ul.mat{margin:6px 0 0;padding-left:1.2em;color:var(--sub);font-size:14px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px;color:var(--sub);margin-top:10px}
.legend svg{width:56px;height:10px}
.status{font-size:15px;color:var(--warn)}.status.ok{color:var(--ok)}
.items{display:grid;gap:12px}
.item{border-top:1px solid var(--rule);padding-top:10px;display:grid;gap:6px}
.item .pics{display:flex;gap:8px;flex-wrap:wrap}
.item img,.item video{height:120px;max-width:100%;border:1px solid var(--rule);background:var(--wall);border-radius:8px}
.meta{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
footer{font-size:11px;color:var(--sub)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
  <h1>工作の手帖</h1>

  <div class="row" id="toys" role="group" aria-label="玩具"></div>
  <div>
    <div class="row" id="sheets" role="group" aria-label="紙"></div>
    <select id="sheet" class="sr" aria-hidden="true" tabindex="-1"></select>
    <p class="set" id="set"></p>
  </div>

  <section class="panel" aria-label="聞く">
    <p class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="17" y="6" width="14" height="24" rx="7"/><path d="M10 22a14 14 0 0 0 28 0M24 36v6M17 42h14"/></svg>聞く</p>
    <form id="ask-form">
      <label for="q" class="sr">聞きたい事</label>
      <input type="text" id="q" maxlength="300" placeholder="谷折りって？" required enterkeyhint="send">
    </form>
    <div class="toggles">
      <label class="toggle" for="speak" title="声で読む"><input type="checkbox" id="speak" checked><span class="sr">声で読む</span><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M4 10h4l6-5v16l-6-5H4zM18 9a5 5 0 0 1 0 8M21 6a9 9 0 0 1 0 14"/></svg></label>
      <label class="toggle" for="auto" title="話し終えたら自動で聞く"><input type="checkbox" id="auto" checked><span class="sr">話し終えたら自動で聞く</span><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M5 13a8 8 0 1 0 3-6M5 4v5h5"/></svg></label>
      <button class="go" id="ask-go" form="ask-form">聞く</button>
    </div>
    <div id="answer" aria-live="polite"></div>
    <details id="steps-box"><summary>組み方</summary><ol class="steps" id="steps"></ol><ul class="mat" id="mat"></ul>
      <div class="legend">
        <svg viewBox="0 0 56 10" aria-hidden="true"><line x1="2" y1="5" x2="54" y2="5" stroke="currentColor" stroke-width="2"/></svg><span>切る</span>
        <svg viewBox="0 0 56 10" aria-hidden="true"><line x1="2" y1="5" x2="54" y2="5" stroke="currentColor" stroke-width="2" stroke-dasharray="6 3"/></svg><span>谷折り（手前にへこむ）</span>
        <svg viewBox="0 0 56 10" aria-hidden="true"><line x1="2" y1="5" x2="54" y2="5" stroke="currentColor" stroke-width="2" stroke-dasharray="9 3 2 3"/></svg><span>山折り（手前に出る）</span>
        <svg viewBox="0 0 56 10" aria-hidden="true"><rect x="2" y="1" width="26" height="8" fill="#f1e9d6"/><rect x="28" y="1" width="26" height="8" fill="#d9caa6"/></svg><span>色の境で折る</span>
      </div>
    </details>
  </section>

  <section class="panel" aria-label="上げる">
    <p class="mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 16h8l4-6h12l4 6h8v24H6z"/><circle cx="24" cy="27" r="8"/></svg>上げる</p>
    <form id="up-form">
      <label class="shot" for="files"><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M8 18h10l5-7h10l5 7h10v28H8z"/><circle cx="28" cy="31" r="9"/></svg>写真・動画<input type="file" id="files" accept="image/*,video/*" multiple></label>
      <p class="picked" id="picked"></p>
      <div class="row" id="results" role="radiogroup" aria-label="見た事"></div>
      <label for="note" class="sr">ひとこと</label><textarea id="note" maxlength="500" placeholder="ひとこと"></textarea>
      <label class="check" for="ok"><input type="checkbox" id="ok" required> 大人の手元だけ・顔なし・声なし</label>
      <p style="margin:6px 0 0"><button class="go" id="up-go">上げる</button></p>
    </form>
    <p class="status" id="up-status" aria-live="polite"></p>
    <div class="items" id="mine"></div>
  </section>

  <section class="panel" id="owner" hidden aria-label="みんなが上げた物">
    <p class="mark">みんなの物（本人だけ）</p>
    <div class="items" id="all"><p class="meta">読み込んでいます…</p></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const DATA = /*TECHO_DATA*/null;
// 見た事の印。成否や上下に見えない形にする（矢印＝動いた、横棒＝動かない、問い＝わからない、波＝揺れた）。
const ICONS = {
  "動いた": '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 34c8 0 14-6 18-18M20 14l8 2 2 8"/></svg>',
  "動かない": '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 24h28"/></svg>',
  "わからない": '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 18a6 6 0 1 1 8 6c-2 1-2 2-2 5"/><circle cx="24" cy="35" r="1"/></svg>',
  "揺れた": '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24c4-8 8-8 12 0s8 8 12 0 8-8 12 0"/></svg>',
  "揺れない": '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24h36"/></svg>',
};
let toyIdx = 0;
const $ = (id) => document.getElementById(id);
// 力は claude.use から受ける。アーティファクトの外（手元の確かめ）では null として扱い、字の操作だけが残る。
const use = (name) => (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null));

function toy() { return DATA.toys[toyIdx]; }
function sheet() { return toy().sheets[$("sheet").selectedIndex] || toy().sheets[0]; }

function renderToy() {
  const t = toy();
  // 玩具は原図の小さな絵で選ぶ。紙は仮説の字だけの大きな印で選ぶ（読む文を置かない）。
  $("toys").replaceChildren(...DATA.toys.map((x, i) => {
    const b = document.createElement("button");
    b.className = "tile"; b.type = "button"; b.setAttribute("aria-pressed", String(i === toyIdx));
    if (x.thumb) { const im = document.createElement("img"); im.src = x.thumb; im.alt = ""; b.append(im); }
    b.append(document.createTextNode(x.toy));
    b.onclick = () => { toyIdx = i; renderToy(); };
    return b;
  }));
  $("sheet").replaceChildren(...t.sheets.map((s) => { const o = document.createElement("option"); o.textContent = s.label; return o; }));
  const pickSheet = () => {
    $("sheets").replaceChildren(...t.sheets.map((s, i) => {
      const b = document.createElement("button");
      b.className = "tile"; b.type = "button"; b.setAttribute("aria-pressed", String(i === $("sheet").selectedIndex));
      b.setAttribute("aria-label", s.label);
      const big = document.createElement("span"); big.className = "big"; big.textContent = s.label.replace("仮説 ", "").replace(" の紙", "");
      b.append(big, document.createTextNode("の紙"));
      b.onclick = () => { $("sheet").selectedIndex = i; pickSheet(); renderSheet(); };
      return b;
    }));
  };
  pickSheet();
  $("set").textContent = t.set;
  $("results").replaceChildren(...t.results.map((r, i) => {
    const l = document.createElement("label"); l.className = "tile"; l.htmlFor = `res-${i}`;
    const inp = document.createElement("input");
    inp.type = "radio"; inp.name = "result"; inp.value = r; inp.id = `res-${i}`; inp.required = true;
    l.append(inp); l.insertAdjacentHTML("beforeend", ICONS[r] || ICONS["わからない"]); l.append(document.createTextNode(r)); return l;
  }));
  $("foot").textContent = `図: ${t.holding}（PDM）`;
  renderSheet();
}
function renderSheet() {
  const s = sheet();
  $("steps").replaceChildren(...s.steps.map((x) => { const li = document.createElement("li"); li.textContent = x; return li; }));
  $("mat").replaceChildren(...s.materials.map((x) => { const li = document.createElement("li"); li.textContent = x; return li; }));
}
$("sheet").onchange = renderSheet;

// 答えを声で読む（両手が塞がっているため）。読み上げが使えない画面では、何もせず字だけを出す。
function speak(text) {
  try {
    if (!$("speak").checked || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) { /* 読み上げが拒まれても字の答えは出ている */ }
}
function showAnswer(text, from) {
  const d = document.createElement("div"); d.className = "answer";
  const f = document.createElement("span"); f.className = "from"; f.textContent = from;
  d.append(f, document.createTextNode(text));
  $("answer").replaceChildren(d);
}

// 手順の質問。src/api/ask.py と同じ線: 仕組みは答えない → よくある言葉は刷った説明 → ほかは見ている人の Claude に組み方と凡例だけ。
$("ask-form").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("q").value.trim().slice(0, 300);
  if (!q) return;
  if (DATA.mechanism.some((w) => q.includes(w))) { showAnswer(DATA.refuse, "答えない質問"); return speak(DATA.refuse); }
  const hits = Object.entries(DATA.glossary).filter(([w]) => q.includes(w)).map(([, t]) => t);
  if (hits.length) { const t = [...new Set(hits)].join(" "); showAnswer(t, "型紙の説明から"); return speak(t); }
  const sample = await use("sample");
  if (!sample) return showAnswer("この画面では AI に聞けません。組み方と凡例を見てください。", "—");
  const s = sheet();
  const context = `組み方:\n${s.steps.map((x, i) => `${i + 1}. ${x}`).join("\n")}\n\n用意する物:\n${s.materials.map((x) => "・" + x).join("\n")}\n\n凡例: 切る＝実線、谷折り＝破線（手前にへこむ）、山折り＝一点鎖線（手前に出る）、糊代＝斜線。線の無い面（外筒と扇）は色の境で折る`;
  $("ask-go").disabled = true;
  showAnswer("考えています…", "Claude");
  try {
    const r = await sample(`${DATA.system}\n\n${context}\n\n質問: ${q}`, { onText: ({ text }) => showAnswer(text, "Claude（手順だけ）") });
    const said = r.text.trim() || "手順の紙の絵を見てください。";
    showAnswer(said, "Claude（手順だけ）"); speak(said);
  } catch (err) {
    showAnswer(err && err.code === "not_granted" ? "AI に聞く許可が無いので答えられません。組み方と凡例を見てください。" : "今は AI に聞けません。少し待ってからもう一度聞いてください。", "—");
  } finally { $("ask-go").disabled = false; }
};

// 話し終えたら自動で聞く。キーボードのマイクで話すと字が入り、2 秒止まったら送る（手で送る操作を減らす）。
let idle = null, lastAsked = "";
$("q").addEventListener("input", () => {
  clearTimeout(idle);
  if (!$("auto").checked) return;
  idle = setTimeout(() => {
    const q = $("q").value.trim();
    if (q.length >= 4 && q !== lastAsked) { lastAsked = q; $("ask-form").requestSubmit(); }
  }, 2000);
});

// できた物を上げる。写真は assets、記録は db の uploads/<自分の ID> に 1 人 1 文書で足していく。
let me = null, db = null, assets = null;
function itemView(it, assetsOn) {
  const d = document.createElement("div"); d.className = "item";
  const m = document.createElement("p"); m.className = "meta";
  m.textContent = `${(it.at || "").slice(0, 16).replace("T", " ")}　${it.toy}　${it.sheet}（${it.set}）　見た事: ${it.result}`;
  d.append(m);
  if (it.note) { const p = document.createElement("p"); p.textContent = it.note; p.style.margin = "0"; d.append(p); }
  const pics = document.createElement("div"); pics.className = "pics";
  for (const a of it.assets || []) {
    const isVideo = (a.type || "").startsWith("video/");
    const el = document.createElement(isVideo ? "video" : "img");
    if (isVideo) { el.controls = true; el.muted = true; el.playsInline = true; el.preload = "metadata"; } else { el.alt = "上げた写真"; el.loading = "lazy"; }
    el.src = a.url || "/_blob/" + a.id; pics.append(el);
  }
  if (pics.children.length) d.append(pics);
  return d;
}
$("files").onchange = () => { const n = $("files").files.length; $("picked").textContent = n ? `${Math.min(n, 3)} つ` : ""; };
function renderMine(items) {
  if (!items.length) return $("mine").replaceChildren();
  $("mine").replaceChildren(...items.slice().reverse().map((x) => itemView(x)));
}

$("up-form").onsubmit = async (e) => {
  e.preventDefault();
  const st = $("up-status"); st.className = "status";
  if (!assets || !db || !me) { st.textContent = "上げる許可がありません"; return; }
  const files = [...$("files").files].slice(0, 3);
  const result = (document.querySelector('input[name="result"]:checked') || {}).value;
  if (!files.length) { st.textContent = "写真か動画を えらんでください"; return; }
  if (!result) { st.textContent = "見た事を えらんでください"; return; }
  $("up-go").disabled = true; st.textContent = "上げています…";
  try {
    const up = [];
    for (const f of files) {
      if (f.size > 20 * 1024 * 1024) throw { code: "too_large" };
      const r = await assets.upload(f); up.push({ id: r.id, url: r.url, type: r.contentType || f.type });
    }
    const ref = db.doc(`uploads/${me}`);
    const snap = await ref.get();
    const items = (snap.exists && snap.data().items) || [];
    const t = toy(), s = sheet();
    items.push({ at: new Date().toISOString(), sid: t.sid, toy: t.toy, sheet: s.label, set: t.set, result, note: $("note").value.trim().slice(0, 500), assets: up });
    await ref.set({ items });
    st.className = "status ok"; st.textContent = "上げました";
    $("up-form").reset(); $("picked").textContent = "";
  } catch (err) {
    st.textContent = err && err.code === "too_large" ? "大きすぎます（1 つ 20MB まで）。動画は短く撮り直してください。" : err && err.code === "not_granted" ? "上げる許可がありません。本人から「使える」の共有を受けてください。" : "上げられませんでした。通信を確かめて、もう一度上げてください。";
  } finally { $("up-go").disabled = false; }
};

(async () => {
  renderToy();
  const user = await use("user");
  db = await use("db"); assets = await use("assets");
  if (user && db) {
    me = await user.id();
    db.doc(`uploads/${me}`).onSnapshot((s) => renderMine((s.exists && s.data().items) || []), () => {});
    if (user.canEdit()) {
      $("owner").hidden = false;
      const t = setTimeout(() => { $("all").replaceChildren(Object.assign(document.createElement("p"), { className: "meta", textContent: "読み込めませんでした" })); }, 10000);
      db.collection("uploads").onSnapshot((q) => {
        clearTimeout(t);
        const all = q.docs.flatMap((d) => ((d.data() || {}).items || []));
        all.sort((a, b) => (a.at < b.at ? 1 : -1));
        $("all").replaceChildren(...(all.length ? all.map((x) => itemView(x)) : [Object.assign(document.createElement("p"), { className: "meta", textContent: "まだありません" })]));
      }, () => { clearTimeout(t); });
    }
  }
})();
</script>
